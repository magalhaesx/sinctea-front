name: Publicar

# docs/07, D3 e D4. Em todo push na main: testa, constroi a imagem Docker e a
# poe para rodar; so entao migra o banco do Neon, com o papel dono. O Render
# publica com o auto-deploy em "After CI Checks Pass": codigo que nao passou
# aqui, ou cujo banco nao migrou, nao vai ao ar. A credencial de dono so
# existe neste workflow, como segredo; o Render nunca a ve.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# O swagger-ui-dist (do @nestjs/swagger, so de desenvolvimento) traz o
# @scarf/scarf, que manda estatistica de instalacao para fora. Aqui, nao.
env:
  SCARF_ANALYTICS: 'false'

# Migracao pela metade nao pode ser cancelada por um push seguinte: os runs
# entram em fila.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04

    # O mesmo PostgreSQL 17 do verificar.yml (docs/07, D8).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sinctea
          POSTGRES_PASSWORD: sinctea
          POSTGRES_DB: sinctea
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinctea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL_TESTE: postgresql://sinctea:sinctea@localhost:5432/sinctea

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Os tres pacotes e a verificacao que os atravessa (a fila offline contra o
      # servidor), com a cobertura (item 25): o vitest reprova abaixo de 60% de
      # linhas ou de ramos nas regras criticas, e o resumo vai para o log.
      - run: npm run test:cobertura
      - name: Guardar o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: relatorios/cobertura
          if-no-files-found: ignore
      - run: npm run build
      - run: npm run build:servidor

      - name: Construir a imagem
        run: |
          docker build -t sinctea .
          bytes=$(docker image inspect sinctea --format '{{.Size}}')
          echo "::notice title=Imagem Docker::$((bytes / 1000000)) MB"

      # Construir nao basta: a imagem sobe, le um banco migrado e responde nas
      # tres rotas que o Render vai servir.
      - name: Pôr a imagem para rodar
        env:
          DATABASE_URL: postgresql://sinctea:sinctea@localhost:5432/sinctea
        run: |
          (cd servidor && npx prisma migrate deploy)
          ultima=$(ls -d servidor/prisma/migracoes/*/ | sort | tail -1 | xargs basename)
          docker run -d --name sinctea --network host -e PORT=8080 -e DATABASE_URL="$DATABASE_URL" sinctea
          trap 'docker logs sinctea' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/api/saude && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/api/saude | grep -q "\"migracao\":\"$ultima\""
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/inexistente)" = 404
          curl -s http://localhost:8080/api/inexistente | grep -q '"statusCode":404'
          # Item 25: a interface do Swagger nunca vai ao ar.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/docs)" = 404

  # Item 25: o pacote de producao no navegador, sobre um banco descartavel deste
  # job, com os dados ficticios da semente (verificacao/servidor.mjs). A semente
  # nunca toca o Neon: aqui nao ha segredo nenhum.
  navegador:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sinctea
          POSTGRES_PASSWORD: sinctea
          POSTGRES_DB: sinctea
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinctea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      URL_ADMIN_VERIFICACAO: postgresql://sinctea:sinctea@localhost:5432/sinctea

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:servidor
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Reprova com violacao "critical" ou "serious" do axe (WCAG 2.2 AA), em
      # todas as rotas de cada perfil, em 1280 e 375 px, com e sem alto
      # contraste e texto maior; e com os fluxos de teclado.
      - name: Acessibilidade e teclado (Playwright e axe)
        run: npm run verificar:navegador

      # So relatorio: a meta e o primeiro conteudo em menos de 2 s em 3G.
      - name: Desempenho (Lighthouse, so relatorio)
        if: always()
        continue-on-error: true
        run: npm run verificar:desempenho

      - name: Guardar os relatorios do navegador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: navegador
          path: |
            relatorios/playwright
            relatorios/playwright-resultados
            relatorios/lighthouse
          if-no-files-found: ignore

  migrar:
    needs: [verificar, navegador]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # O npm ci baixa o motor de migracao do Prisma.
      - run: npm ci
      - name: Migrar o banco do Neon
        working-directory: servidor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRACAO }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta o segredo DATABASE_URL_MIGRACAO (URL direta do dono, no Neon)."
            exit 1
          fi
          # O log e publico: a linha Datasource diria o endereco do banco.
          set -o pipefail
          npx prisma migrate deploy 2>&1 | sed '/Datasource/d' | tee migracao.log
          # Sem migracao pendente, o grep nao acha nada e sai com 1: com o
          # pipefail do Actions, isso derrubava o job. O "|| true" e de proposito.
          aplicadas=$({ grep -oE '[0-9]{14}_[a-z_]+' migracao.log || true; } | sort -u | tr '\n' ' ')
          echo "::notice title=Migracoes aplicadas neste run::${aplicadas:-nenhuma, o banco ja estava em dia}"
          npx prisma migrate status 2>&1 | sed '/Datasource/d'
